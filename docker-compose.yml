services:
  mongo:
    image: mongo:7
    container_name: mern-blog-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: mern-blog-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/mernblog
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: mern-blog-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "5173:5173"

volumes:
  mongo-data:
